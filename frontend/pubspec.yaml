name: fyp_neobanking
description: AI-Powered Personal Finance Advisor — FYP by Lau Zheng Cheng (TP071393)

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase — database and authentication
  supabase_flutter: ^2.3.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.2.0

  # QR Code scanning
  mobile_scanner: ^5.1.0

  # QR Code generation
  qr_flutter: ^4.1.0

  # Firebase — push notifications and analytics
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Push notifications (foreground display)
  flutter_local_notifications: ^17.1.2

  # HTTP requests to Node.js backend
  dio: ^5.4.3+1

  # Secure storage for tokens
  flutter_secure_storage: ^9.0.0

  # Internationalisation and number/date formatting
  intl: ^0.19.0

  # UI utilities
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.67.0

  # Goal completion celebration animation
  lottie: ^3.1.2

  # Icons
  cupertino_icons: ^1.0.6
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  flutter_inappwebview: ^6.1.5

  flutter_launcher_icons: ^0.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/FinWise logo.png"
  adaptive_icon_background: "#0A0800"
  adaptive_icon_foreground: "assets/FinWise logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/tradingview.html
    - assets/Financial News.png
    - assets/Smart Deals.png
    - assets/Saving Bank.png
    - assets/animations/confetti.json